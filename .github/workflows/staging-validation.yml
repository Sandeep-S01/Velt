name: Staging validation

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Staging API URL ending in /api/v1
        required: true
        type: string
      dashboard_base_url:
        description: Staging dashboard URL
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    env:
      STAGING_API_BASE_URL: ${{ inputs.api_base_url }}
      STAGING_DASHBOARD_BASE_URL: ${{ inputs.dashboard_base_url }}
      BETA_INVITE_CODE: ${{ secrets.BETA_INVITE_CODE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: smartsearch-api/requirements-ci.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-ci.txt
        working-directory: smartsearch-api
      - name: Run staging smoke checks
        working-directory: smartsearch-api
        run: python scripts/staging_smoke.py --confirm-destructive-staging --output artifacts/staging-validation.json
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-validation-evidence
          path: smartsearch-api/artifacts/staging-validation.json
          if-no-files-found: error
          retention-days: 30

  dashboard-dast:
    needs: smoke
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Passive dashboard security scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ inputs.dashboard_base_url }}
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-dashboard-report
          cmd_options: -a -j -T 5

  api-dast:
    needs: smoke
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Passive API security scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ inputs.api_base_url }}
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-api-report
          cmd_options: -a -T 5
