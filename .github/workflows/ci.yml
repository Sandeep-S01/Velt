name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smartsearch-api
    env:
      TESTING: "true"
      DATABASE_URL: sqlite:///./test.db
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-secret-key-with-at-least-32-bytes
      USE_HF_INFERENCE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            smartsearch-api/requirements.txt
            smartsearch-api/requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-all-MiniLM-L6-v2
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check app tests
      - run: python -m compileall -q app
      - run: python -m pytest -q
      - run: docker build --tag velt-api:ci .
      # Chroma PYSEC-2026-311 has no fixed release yet. Velt uses embedded
      # PersistentClient only; see smartsearch-api/docs/security-risk-register.md.
      - run: python -m pip_audit -r requirements.txt --ignore-vuln PYSEC-2026-311

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
