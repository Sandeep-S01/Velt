name: Deploy Render API

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: render-production-api
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      API_ORIGIN: ${{ vars.RENDER_API_ORIGIN || 'https://velt.onrender.com' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check deployment configuration
        shell: bash
        run: |
          if [[ -z "$RENDER_DEPLOY_HOOK_URL" ]]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL is required; no release was deployed."
            exit 1
          fi

      - name: Deploy tested commit
        shell: bash
        run: |
          curl --fail --silent --show-error --get \
            --data-urlencode "ref=$DEPLOY_SHA" \
            "$RENDER_DEPLOY_HOOK_URL" \
            --output deploy-response.json

      - name: Verify deployed release
        working-directory: smartsearch-api
        run: |
          python scripts/verify_deployment.py \
            --api-origin "$API_ORIGIN" \
            --expected-release "$DEPLOY_SHA" \
            --output "artifacts/deployment-verification-$DEPLOY_SHA.json"

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-verification-${{ env.DEPLOY_SHA }}
          path: smartsearch-api/artifacts/deployment-verification-*.json
          if-no-files-found: warn
          retention-days: 30
