[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".venv",
    "alembic/versions",
    "debug_*.py",
]

[tool.ruff.lint]
select = ["F", "E9"]
ignore = ["E402"]
